# 프로젝트 이름
spring.application.name=back-end


# 서브 포트
server.port=80

# 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

# 로그 출력 패턴
logging.pattern.console=%clr(%-5level){green} %clr(%logger{15}.%M\\(\\)){cyan}: %msg %n
logging.level.root=INFO

# 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# OpenAI API KEY
openai_api_key = ${OPENAI_API_KEY}

# MyBatis 설정 및 Mapper XML
mybatis.config-location=classpath:/mybatis/mybatis-config.xml
mybatis.mapper-locations=classpath:/mybatis/mapper/**/*.xml

# Oracle 연결 (database/README.md의 로컬 접속 정보)
# 기존 PostgreSQL용 DB_URL과 구분하여 Oracle 전용 환경변수를 사용한다.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
spring.datasource.username=${ORACLE_DB_USERNAME:oracle}
spring.datasource.password=${ORACLE_DB_PASSWORD:oracle}

jwt.secret.key = ${JWT_SECRET_KEY}